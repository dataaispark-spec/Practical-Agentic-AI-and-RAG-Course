name: Course QA

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  structural-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile all course Python sources
        run: python -m compileall -q 00-course-roadmap 00-course-toolkit 01-ai-systems-thinking 02-python-ai-engineering 03-fastapi-testing 04-llm-application-foundations 05-prompting-evaluation 06-rag-from-first-principles 07-embeddings-vector-db 08-document-intelligence-pii 09-advanced-retrieval 10-rag-optimization 11-rag-evaluation 12-rag-debugging 13-tool-calling-api-agents 14-raw-agent-loop 15-memory 16-langgraph-stateful-workflows 17-planning-human-in-the-loop 18-agent-security 19-multi-agent-reality-check 20-multi-agent-architectures 21-coordination-fault-tolerance 22-multi-agent-debugging 23-mcp-fundamentals 24-mcp-server-enterprise 25-observability 26-production-evaluation 27-cost-engineering 28-responsible-ai-governance 29-deployment-cicd 30-enterprise-agentic-rag-capstone 31-knowledge-engineering-graph-rag 32-graph-engineering-temporal-knowledge 33-agentic-knowledge-graph-construction 34-graph-vector-hybrid-retrieval 35-compounding-knowledge-llm-wiki 36-loop-engineering 37-harness-engineering 38-long-running-autonomous-agents 39-skills-memory-continual-harnesses 40-environments-verifiers-agentic-rl 41-recursive-self-improving-agents 42-computer-use-always-on-ai-teammates 43-frontier-graph-rag-agentic-capstone
      - name: Run canonical 43-module structural QA
        run: python 00-course-roadmap/course_qa_checker.py --strict

  module-tests:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install runtime QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all 43 module test suites
        shell: bash
        run: |
          set -uo pipefail
          failures=()
          for n in $(seq -w 1 43); do
            case "$n" in
              01) DIR="01-ai-systems-thinking";;
              02) DIR="02-python-ai-engineering";;
              03) DIR="03-fastapi-testing";;
              06) DIR="06-rag-from-first-principles";;
              31) DIR="31-knowledge-engineering-graph-rag";;
              32) DIR="32-graph-engineering-temporal-knowledge";;
              33) DIR="agentic-knowledge-graph-construction";;
              34) DIR="34-graph-vector-hybrid-retrieval";;
              35) DIR="35-compounding-knowledge-llm-wiki";;
              36) DIR="36-loop-engineering";;
              37) DIR="37-harness-engineering";;
              38) DIR="38-long-running-autonomous-agents";;
              39) DIR="39-skills-memory-continual-harnesses";;
              40) DIR="40-environments-verifiers-agentic-rl";;
              41) DIR="41-recursive-self-improving-agents";;
              42) DIR="42-computer-use-always-on-ai-teammates";;
              43) DIR="43-frontier-graph-rag-agentic-capstone";;
              *) DIR="$(find . -maxdepth 1 -type d -name "${n}-*" -print -quit | sed 's#^./##')";;
            esac
            echo "===== TEST M$n: $DIR ====="
            if [[ ! -d "$DIR/tests" ]]; then
              echo "M$n missing tests directory"
              failures+=("M$n")
              continue
            fi
            if ! PYTHONPATH="$DIR:$DIR/app:${PYTHONPATH:-}" pytest -q "$DIR/tests"; then
              failures+=("M$n")
            fi
          done
          if (( ${#failures[@]} > 0 )); then
            echo "FAILED MODULES: ${failures[*]}"
            exit 1
          fi
          echo "All 43 module test suites passed."

  notebook-runtime:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install notebook QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Execute all 43 canonical module notebooks
        run: python 00-course-roadmap/run_notebook_qa.py --modules 1-43 --timeout 300 --continue-on-error

  final-qa-gate:
    if: always()
    needs: [structural-qa, module-tests, notebook-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require all canonical QA jobs to pass
        run: |
          test "${{ needs.structural-qa.result }}" = "success"
          test "${{ needs.module-tests.result }}" = "success"
          test "${{ needs.notebook-runtime.result }}" = "success"
          echo "43-module QA gate passed."
